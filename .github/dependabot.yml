# Compass: monthly dependency updates, one grouped pull request per folder.
# Major versions are skipped here; they get a dedicated upgrade pass.
# `compass-deps` checks each pull request locally and merges the ones that pass.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
