name = "medconnect"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-03-28"
compatibility_flags = ["nodejs_compat"]

[vars]
MSG91_TEMPLATE_ID = ""
APP_URL = "https://medconnect.in"
SES_FROM_EMAIL = "forms@mycompass.in"
ADMIN_EMAIL = "mywebsite@mycompass.in"
TURNSTILE_SITE_KEY = ""
TURNSTILE_ENFORCE_AFTER = "2026-04-29T00:00:00Z"
# Primary email provider — see src/lib/auth/otp.ts. The other provider is always the
# automatic backup, so set this to "ses" to make SES primary instead.
MAIL_PROVIDER = "cloudflare"

# Cloudflare Email Routing — native send binding, verified for mycompass.in.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["forms@mycompass.in"]

# Secrets (set via `wrangler secret put`):
# MSG91_AUTH_KEY
# SESSION_SECRET
# TURNSTILE_SECRET_KEY

[[d1_databases]]
binding = "DB"
database_name = "medconnect-db"
database_id = "17121db9-4084-4b9c-9636-517dfa945ea8"
migrations_dir = "src/lib/db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "medconnect-files"

[[kv_namespaces]]
binding = "SESSIONS"
id = "b2fab377ec7047c6948f84f6fd581489"

# Astro's Cloudflare adapter uses a default built-in session binding named `SESSION`.
[[kv_namespaces]]
binding = "SESSION"
id = "b2fab377ec7047c6948f84f6fd581489"

# ChatRoom DO is defined in medconnect-chat-do worker, referenced here by script_name
[durable_objects]
bindings = [
  { name = "CHAT_ROOMS", class_name = "ChatRoom", script_name = "medconnect-chat-do" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[secrets_store_secrets]]
binding = "AWS_SES_ACCESS_KEY_ID"
store_id = "07f5856b582c4503811d8d1e7ac2e18f"
secret_name = "AWS_SES_ACCESS_KEY_ID"

[[secrets_store_secrets]]
binding = "AWS_SES_SECRET_ACCESS_KEY"
store_id = "07f5856b582c4503811d8d1e7ac2e18f"
secret_name = "AWS_SES_SECRET_ACCESS_KEY"

[[secrets_store_secrets]]
binding = "AWS_SES_REGION"
store_id = "07f5856b582c4503811d8d1e7ac2e18f"
secret_name = "AWS_SES_REGION"

# Workers Logs: keep errors and console output for the dashboard (Compass default).
[observability]
enabled = true
